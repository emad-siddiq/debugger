# Burrow-managed pgAdmin sidecar (architecture task 10 — the pgAdmin surface).
#
# Runs pgAdmin 4 in desktop mode (no login / no master password) and iframe-
# friendly (X-Frame-Options cleared) so Burrow can embed it in a webview. It is
# pre-provisioned to the single merkle Postgres via servers.json + pgpass, both
# GENERATED by the extension from the resolved connection string (see
# pgadmin.ts) and git-ignored — this file carries no credentials.
#
# It reaches the database over the HOST at host.docker.internal:5432 (the single
# nodewatch-db publishes 5432 on the host), so it needs no attachment to
# merkle's compose network. On Docker Desktop host.docker.internal resolves
# automatically; extra_hosts makes it work on a Linux daemon too.
services:
  pgadmin:
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: burrow@example.com
      PGADMIN_DEFAULT_PASSWORD: burrow
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_X_FRAME_OPTIONS: "''"
      PGADMIN_CONFIG_WTF_CSRF_ENABLED: "False"
    ports:
      - "127.0.0.1:6110:80"
    volumes:
      - ./servers.json:/pgadmin4/servers.json:ro
      - ./pgpass:/pgpass:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
